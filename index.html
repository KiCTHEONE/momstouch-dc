<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>알바관리</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="알바관리">
<meta name="theme-color" content="#1B1916">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1916;
    --bg-alt:#100F0D;
    --panel:#221F1B;
    --ink:#F3EFE9;
    --sub:#8C887F;
    --sub2:#C7C2B8;
    --line:#332F29;
    --line-mid:#4A453C;
    --navy:#D9A441;
    --hall:#D9A441;
    --kitchen:#C6672D;
    --danger:#E4635A;
    --brand:#E2402F;
    --work-green:#3FAE73;
    --work-green-bg:#182922;
    --navy-bg:#2A2416;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;color-scheme:dark;}
  body{
    background:var(--bg-alt);
    color:var(--ink);
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  @media (min-width:820px){
    body{ padding:0; align-items:stretch; }
    #app{
      max-width:none;
      width:100%;
      min-height:100vh;
      box-shadow:none;
    }
    header.topbar{ padding:24px 40px 14px 40px; }
    main{ padding:8px 40px 88px 40px; max-width:1000px; margin:0 auto; width:100%; }
    table.cal td{ height:84px; font-size:12px; }
    .modal{ max-width:520px; margin:0 auto; }
    .overlay{ align-items:center; }
    .fab{ max-width:none; }
  }
  @media (min-width:1400px){
    main{ max-width:1160px; }
  }
  header.topbar{
    padding:16px 16px 10px 16px;
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:5;
    border-bottom:1px solid var(--line);
  }
  header.topbar h1{
    margin:0;
    font-size:15px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header.topbar .accent-bar{
    width:20px;height:3px;
    background:var(--brand);
    margin-top:8px;
  }
  .today-widget{
    display:flex;
    align-items:stretch;
    margin-top:12px;
    border:1px solid var(--line-mid);
    background:var(--panel);
  }
  .today-widget > div{
    padding:9px 12px;
    font-size:11.5px;
    font-weight:600;
    color:var(--sub2);
    border-right:1px solid var(--line-mid);
    display:flex;
    align-items:center;
  }
  .today-widget > div:last-child{border-right:none;}
  .today-widget .tw-time{
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    font-weight:800;
    font-size:13px;
  }
  .today-widget .tw-weather{color:var(--ink);font-weight:700;}
  .content-col{
    display:flex;
    flex-direction:column;
    flex:1;
    min-width:0;
  }
  main{
    flex:1;
    padding:2px 16px 84px 16px;
    overflow-y:auto;
  }
  nav.tabbar{
    position:sticky;
    bottom:0;
    display:flex;
    border-top:1px solid var(--line);
    background:rgba(27,25,22,.94);
    backdrop-filter:blur(6px);
    z-index:6;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1;
    border:none;
    background:transparent;
    padding:11px 4px 10px 4px;
    font-size:11.5px;
    font-weight:500;
    color:var(--sub);
    cursor:pointer;
    letter-spacing:-.01em;
    position:relative;
    transition:color .15s;
  }
  nav.tabbar button.active{color:var(--ink);font-weight:700;}
  nav.tabbar button.active::after{
    content:'';
    position:absolute;
    top:0;left:50%;
    transform:translateX(-50%);
    width:22px;height:2.5px;
    background:var(--brand);
  }
  nav.tabbar button.lockbtn{
    flex:0 0 auto;
    padding-left:14px;
    padding-right:14px;
    color:var(--sub);
    border-left:1px solid var(--line);
  }
  .section-title{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--sub);
    text-transform:uppercase;
    margin:18px 0 2px 0;
  }
  .section-title:first-child{margin-top:12px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    border:none;
    background:transparent;
    color:var(--sub2);
    font-size:12px;
    font-weight:600;
    padding:6px 0;
    cursor:pointer;
    border-radius:0;
    transition:opacity .12s;
  }
  .btn:active{opacity:.6;}
  .btn.primary{
    background:var(--brand);
    color:#fff;
    padding:12px 14px;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .btn.brand{
    background:var(--brand);
    color:#fff;
    padding:12px 14px;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .btn.danger{color:var(--danger);}
  .btn.strong{color:var(--ink);}
  .btn.block{width:100%;}
  .btn.outline{
    border:1.5px solid var(--navy);
    padding:8px 12px;
    color:var(--navy);
    font-weight:700;
  }
  .fab{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    max-width:460px;
    width:100%;
    height:0;
    pointer-events:none;
  }
  .fab-btn{
    pointer-events:auto;
    position:absolute;
    right:16px;
    bottom:calc(70px + env(safe-area-inset-bottom));
    width:44px;height:44px;
    background:var(--brand);
    color:#fff;
    border:none;
    font-size:22px;
    font-weight:400;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    border-radius:0;
    box-shadow:0 4px 12px rgba(0,0,0,.18);
  }
  .emp-row{
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .emp-row.inactive{opacity:.4;}
  .emp-row .row-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .emp-row .name{font-size:14.5px;font-weight:700;}
  .emp-row .name .status{font-size:10px;font-weight:500;color:var(--sub);margin-left:5px;}
  .dot{
    display:inline-block;
    width:5px;height:5px;
    margin-right:5px;
    flex-shrink:0;
  }
  .pos-line{
    margin-top:5px;
    font-size:12px;
    color:var(--sub2);
    display:flex;
    align-items:center;
  }
  .sched-item-t{font-size:11px;color:var(--sub);margin-top:2px;text-align:right;}
  .clock-card{
    border:1px solid var(--line);
    border-left:4px solid var(--line-mid);
    padding:16px;
    margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
    background:var(--panel);
  }
  .clock-card.status-working{border-left-color:var(--work-green);background:var(--work-green-bg);}
  .clock-card.status-done{border-left-color:var(--navy);}
  .clock-card .ccrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .clock-card .cname{font-size:15px;font-weight:800;}
  .status-label{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;margin-top:4px;}
  .status-label .sq{width:6px;height:6px;flex-shrink:0;}
  .status-idle .status-label{color:var(--sub);}
  .status-idle .status-label .sq{background:var(--sub);}
  .status-working .status-label{color:var(--work-green);}
  .status-working .status-label .sq{background:var(--work-green);animation:pulse 1.4s infinite;}
  .status-done .status-label{color:var(--navy);}
  .status-done .status-label .sq{background:var(--navy);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .clock-card .ctotal{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:6px;}
  .clock-card .cdetail{font-size:11px;color:var(--sub);margin-top:2px;}
  .meta-row{
    margin-top:2px;
    font-size:11.5px;
    color:var(--sub);
  }
  .meta-row a{color:var(--sub2);text-decoration:none;font-weight:600;}
  .emp-row .actions{
    margin-top:8px;
    display:flex;
    gap:13px;
    align-items:center;
  }
  .empty{
    text-align:center;
    color:var(--sub);
    font-size:12.5px;
    padding:50px 16px;
  }
  .cal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:14px 0 10px 0;
  }
  .cal-head .title{font-size:14px;font-weight:700;}
  .cal-head button{
    border:none;
    background:transparent;
    width:24px;height:24px;
    font-size:15px;
    font-weight:400;
    color:var(--sub2);
    cursor:pointer;
  }
  table.cal{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }
  table.cal th{
    font-size:9.5px;
    color:var(--sub);
    font-weight:600;
    padding:3px 0 6px 0;
    border-bottom:1px solid var(--line-mid);
  }
  table.cal td{
    vertical-align:top;
    border-bottom:1px solid var(--line);
    height:52px;
    padding:4px 2px;
    font-size:10px;
    cursor:pointer;
  }
  table.cal td.otherm{color:#4A453C;}
  table.cal td.today .dnum{
    display:inline-block;
    background:var(--brand);
    color:#fff;
    width:15px;height:15px;
    line-height:15px;
    text-align:center;
    border-radius:50%;
  }
  table.cal td .dnum{font-size:10px;font-weight:600;margin-bottom:2px;color:var(--ink);}
  table.cal td.otherm .dnum{color:#4A453C;}
  .cal-tag{
    display:flex;
    align-items:center;
    gap:2px;
    font-size:8.5px;
    font-weight:500;
    margin-bottom:1px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:var(--sub2);
  }
  .cal-tag .sq{width:4px;height:4px;flex-shrink:0;background:var(--sub2);}
  .cal-tag.pend .sq{background:transparent;border:1px solid var(--sub);}
  .cal-tag.pend{color:var(--sub);}
  .legend{display:flex;gap:14px;margin-top:14px;font-size:10px;color:var(--sub);}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .legend .sq{width:5px;height:5px;display:inline-block;}
  .legend .sq.solid{background:var(--sub2);}
  .legend .sq.hollow{border:1px solid var(--sub);}
  .wl-item{
    padding:10px 0;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .wl-item .info b{font-size:13px;font-weight:700;}
  .wl-item .info .subtag{font-size:9.5px;font-weight:600;color:var(--kitchen);margin-left:5px;}
  .wl-item .info .sub{font-size:11px;color:var(--sub);margin-top:2px;}
  .sched-item{
    padding:10px 0;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .sched-item .t{font-size:11px;color:var(--sub);margin-top:2px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:10.5px;font-weight:600;color:var(--sub);margin-bottom:5px;letter-spacing:.02em;}
  .field select,.field input[type=text],.field input[type=tel],.field input[type=number],.field input[type=date],.field input[type=time]{
    width:100%;
    border:none;
    border-bottom:1.5px solid var(--line-mid);
    background:transparent;
    padding:7px 0;
    font-size:14px;
    border-radius:0;
    font-family:inherit;
    color:var(--ink);
    appearance:none;
    -webkit-appearance:none;
  }
  .field select{
    background:var(--panel);
    color-scheme:dark;
  }
  .field select option{
    background:var(--panel);
    color:var(--ink);
  }
  .field select:focus,.field input:focus{outline:none;border-bottom-color:var(--brand);}
  .row2{display:flex;gap:16px;}
  .row2 .field{flex:1;}
  .quickrange{display:flex;gap:16px;margin:-4px 0 14px 0;}
  .quickrange .btn{padding:0;font-size:11.5px;}
  .result-box{
    padding-top:14px;
    margin-top:6px;
    border-top:1px solid var(--line-mid);
  }
  .result-total{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding-bottom:12px;
    margin-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .result-total .lbl{font-size:11.5px;color:var(--sub);font-weight:600;}
  .result-total .val{font-size:24px;font-weight:800;color:var(--navy);}
  .payline{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    padding:7px 0;
    border-bottom:1px solid var(--line);
  }
  .payline:last-child{border-bottom:none;}
  .payline .d1{color:var(--sub);}
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.65);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  #ovPin{ align-items:center; }
  .modal{
    width:100%;
    max-width:460px;
    max-height:86vh;
    overflow-y:auto;
    background:var(--panel);
    padding:18px 16px 26px 16px;
    padding-bottom:calc(26px + env(safe-area-inset-bottom));
  }
  .modal h2{margin:0 0 16px 0;font-size:15px;font-weight:700;}
  .modal .close-x{
    position:absolute;
    right:14px;
    top:14px;
    background:none;
    border:none;
    font-size:16px;
    cursor:pointer;
    color:var(--sub);
  }
  .modal-wrap{position:relative;}
  .days-picker{display:flex;justify-content:space-between;}
  .days-picker label{
    width:32px;height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line-mid);
    font-size:11.5px;
    font-weight:600;
    color:var(--sub2);
    cursor:pointer;
    user-select:none;
    transition:background .1s,color .1s,border-color .1s;
    flex:none;
  }
  .days-picker input{display:none;}
  .days-picker label.checked{background:var(--brand);color:#fff;border-color:var(--brand);}
  .seg{display:flex;border-bottom:1.5px solid var(--line-mid);}
  .seg button{
    flex:1;
    padding:8px 0;
    border:none;
    background:transparent;
    font-size:12px;
    font-weight:600;
    color:var(--sub);
    cursor:pointer;
    margin-bottom:-1.5px;
    border-bottom:1.5px solid transparent;
  }
  .seg button.on{color:var(--brand);border-bottom-color:var(--brand);}
  .checkline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub2);}
  .checkline input{width:15px;height:15px;}
  .toast{
    position:fixed;
    bottom:76px;
    left:50%;
    transform:translateX(-50%);
    background:#2E2A24;
    border:1px solid var(--line-mid);
    color:var(--ink);
    font-size:11.5px;
    font-weight:500;
    padding:10px 14px;
    z-index:80;
    opacity:0;
    transition:opacity .2s;
    pointer-events:none;
    max-width:88%;
    white-space:normal;
    word-break:break-all;
    text-align:center;
    line-height:1.4;
  }
  .toast.show{opacity:1;}
  .confirm-inline{display:flex;gap:12px;}
  .loading{padding:70px 16px;text-align:center;color:var(--sub);font-size:12.5px;}
  .hint{font-size:10.5px;color:var(--sub);margin-top:4px;}

  /* ---- lock screen ---- */
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-7px);}
    40%,60%{transform:translateX(7px);}
  }
  .lockscreen{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:var(--bg);
  }
  .lock-logo{text-align:center;margin-bottom:40px;}
  .lock-logo .brand{font-size:23px;font-weight:900;letter-spacing:-.01em;color:var(--ink);}
  .lock-logo .bar{width:26px;height:3px;background:var(--brand);margin:9px auto 0 auto;}
  .lock-logo .store{font-size:12px;font-weight:600;color:var(--sub2);margin-top:9px;letter-spacing:.02em;}
  .pin-dots{display:flex;gap:14px;margin-bottom:34px;}
  .pin-dot{width:11px;height:11px;border:1.5px solid var(--line-mid);}
  .pin-dot.filled{background:var(--ink);border-color:var(--ink);}
  .pin-dot.error{background:var(--danger);border-color:var(--danger);}
  .keypad{display:grid;grid-template-columns:repeat(3,60px);gap:13px;justify-content:center;}
  .keypad button{
    width:60px;height:60px;
    border:1px solid var(--line-mid);
    background:transparent;
    font-size:19px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    border-radius:0;
  }
  .keypad button.empty{visibility:hidden;cursor:default;}
  .keypad button.back{font-size:15px;color:var(--sub2);}
  .lock-error{font-size:11.5px;color:var(--danger);font-weight:600;height:16px;margin-top:14px;}
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loading">불러오는 중…</div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ STATE ============ */
const WD = ['일','월','화','수','목','금','토'];
const ORDER = ['월','화','수','목','금','토','일'];
const COLORS = ['#1D3357','#8A3A1F','#3A6B4A','#6B3A6B','#8A6A1F','#1F6B7A','#7A2E3E','#4A4A1F'];

let state = {
  employees: [],
  worklogs: [],
  tab: 'clockin',
  unlocked: false,
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  loaded: false,
  weather: null
};

function nowHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function dateLabel(){ const n=new Date(); return `${n.getMonth()+1}월 ${n.getDate()}일 (${WD[n.getDay()]})`; }
function weatherIcon(code){
  if(code===0) return '☀️';
  if(code>=1&&code<=3) return '⛅';
  if(code===45||code===48) return '🌫️';
  if(code>=51&&code<=67) return '🌧️';
  if(code>=71&&code<=77) return '🌨️';
  if(code>=80&&code<=82) return '🌦️';
  if(code>=95) return '⛈️';
  return '🌡️';
}
async function fetchWeather(){
  try{
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5509&longitude=126.865&current=temperature_2m,weather_code&timezone=Asia%2FSeoul');
    if(r.ok){
      const d = await r.json();
      state.weather = { temp: Math.round(d.current.temperature_2m), code: d.current.weather_code };
    }
  }catch(err){ /* weather is optional, fail silently */ }
}
function todayStr(){ return fmtDate(new Date()); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function won(n){ return Math.round(n).toLocaleString('ko-KR')+'원'; }
function colorFor(id){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; }
function calcHours(start,end){
  if(!start || !end) return 0;
  const [sh,sm]=start.split(':').map(Number), [eh,em]=end.split(':').map(Number);
  let s=sh*60+sm, e=eh*60+em;
  if(e<=s) e+=24*60;
  return (e-s)/60;
}
function floorTime(t, unit){
  if(!t) return t;
  const [h,m] = t.split(':').map(Number);
  const total = h*60+m;
  const rounded = Math.floor(total/unit)*unit;
  const rh = Math.floor(rounded/60)%24;
  const rm = rounded%60;
  return String(rh).padStart(2,'0')+':'+String(rm).padStart(2,'0');
}
const SLOT_TIMES = {
  '오전': { start:'10:30', end:'17:00' },
  '오후': { start:'17:00', end:'22:00' },
  '풀': { start:'10:30', end:'22:00' }
};
function fmtHours(h){
  const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  return mm? `${hh}시간 ${mm}분` : `${hh}시간`;
}
function formatPhone(v){
  const d = (v||'').replace(/[^0-9]/g,'').slice(0,11);
  if(d.length<4) return d;
  if(d.startsWith('02')){
    if(d.length<=5) return d.slice(0,2)+'-'+d.slice(2);
    if(d.length<=9) return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5);
    return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
  }
  if(d.length<=7) return d.slice(0,3)+'-'+d.slice(3);
  if(d.length<=10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7,11);
}
function showToast(msg, duration){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.classList.remove('show'), duration||1800);
}

/* ============ STORAGE (Firebase Realtime Database) ============ */
const FB_URL = 'https://momstouch-dc-default-rtdb.firebaseio.com';
async function loadAll(){
  try{
    const r = await fetch(FB_URL+'/employees.json', {cache:'no-store'});
    if(r.ok){
      const data = await r.json();
      state.employees = Array.isArray(data) ? data.filter(Boolean) : (data ? Object.values(data) : []);
    } else {
      state.employees = [];
      const t = await r.text().catch(()=>'');
      showToast(`불러오기 실패 (${r.status}) ${t}`.slice(0,400), 10000);
    }
  }catch(err){ state.employees = []; showToast('불러오기 오류: '+(err&&err.message?err.message:String(err)), 10000); }
  try{
    const r2 = await fetch(FB_URL+'/worklogs.json', {cache:'no-store'});
    if(r2.ok){
      const data2 = await r2.json();
      state.worklogs = Array.isArray(data2) ? data2.filter(Boolean) : (data2 ? Object.values(data2) : []);
    } else {
      state.worklogs = [];
    }
  }catch(err){ state.worklogs = []; }
  state.loaded = true;
}
async function saveEmployees(){
  try{
    const r = await fetch(FB_URL+'/employees.json', {
      method:'PUT',
      cache:'no-store',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state.employees)
    });
    if(!r.ok){
      const t = await r.text().catch(()=>'');
      showToast(`저장 실패 (${r.status}) ${t}`.slice(0,400), 10000);
    }
  }catch(err){ showToast('저장 오류: '+(err&&err.message?err.message:String(err)), 10000); }
}
async function saveWorklogs(){
  try{

      method:'PUT',
      cache:'no-store',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state.worklogs)
    });
    if(!r.ok){
      const t = await r.text().catch(()=>'');
      showToast(`저장 실패 (${r.status}) ${t}`.slice(0,400), 10000);
    }
  }catch(err){ showToast('저장 오류: '+(err&&err.message?err.message:String(err)), 10000); }
}

/* ============ CLOCK-IN TAB (no PIN required, for staff) ============ */
function renderClockIn(){
  const main = document.getElementById('main');
  document.getElementById('fabWrap').innerHTML = '';
  const today = todayStr();
  const active = state.employees.filter(e=>e.active);
  if(active.length===0){
    main.innerHTML = `<div class="empty">등록된 알바가 없습니다.</div>`;
    return;
  }
  const now = new Date();

  main.innerHTML = `
    <div class="section-title" style="margin-top:14px;">오늘 출퇴근 현황 · ${active.length}명</div>
    <div id="clockList"></div>
  `;
  const list = document.getElementById('clockList');
  list.innerHTML = active.map(e=>{
    const todays = state.worklogs.filter(w=>w.employeeId===e.id && w.date===today);
    const open = todays.find(w=>!w.endTime);
    const completed = todays.filter(w=>w.endTime);
    const todayTotalHours = completed.reduce((s,w)=>s+calcHours(w.startTime,w.endTime),0);

    let statusClass = 'status-idle', statusText = '출근 전';
    if(open){ statusClass='status-working'; statusText='근무중'; }
    else if(completed.length>0){ statusClass='status-done'; statusText='근무 완료'; }

    const btnHtml = open
      ? `<button class="btn brand" data-act="clockout" data-emp="${e.id}" data-log="${open.id}">퇴근하기</button>`
      : `<button class="btn outline" data-act="clockin" data-emp="${e.id}">출근하기</button>`;

    const detailLines = [];
    if(open) detailLines.push(`${open.startTime} 출근함`);
    completed.forEach(w=>detailLines.push(`완료 · ${w.startTime}~${w.endTime}`));

    return `
      <div class="clock-card ${statusClass}">
        <div class="ccrow">
          <div>
            <div class="cname">${escapeHtml(e.name)}</div>
            <div class="status-label"><span class="sq"></span>${statusText}</div>
          </div>
          <div>${btnHtml}</div>
        </div>
        ${detailLines.map(d=>`<div class="cdetail">${d}</div>`).join('')}
        ${todayTotalHours>0? `<div class="ctotal">오늘 총 ${fmtHours(todayTotalHours)}</div>` : ''}
      </div>`;
  }).join('');

  list.querySelectorAll('[data-act]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const empId = b.dataset.emp;
      if(b.dataset.act==='clockin') clockIn(empId);
      if(b.dataset.act==='clockout') clockOut(b.dataset.log);
    });
  });
}

function clockIn(empId){
  const emp = state.employees.find(e=>e.id===empId);
  if(!emp) return;
  const log = {
    id: uid(),
    date: todayStr(),
    employeeId: emp.id,
    name: emp.name,
    startTime: nowHHMM(),
    endTime: '',
    wage: emp.wage,
    isSub: false,
    subForName: '',
    note: '셀프 출근'
  };
  state.worklogs.push(log);
  saveWorklogs();
  renderClockIn();
  showToast(`${emp.name}님 출근 처리했습니다 (${log.startTime})`);
}
function clockOut(logId){
  const log = state.worklogs.find(w=>w.id===logId);
  if(!log) return;
  log.endTime = nowHHMM();
  saveWorklogs();
  renderClockIn();
  showToast(`${log.name}님 퇴근 처리했습니다 (${log.endTime})`);
}

/* ============ CALENDAR TAB ============ */
function renderCalendar(){
  const main = document.getElementById('main');
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y,m,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const daysInPrevMonth = new Date(y,m,0).getDate();

  let cells = [];
  for(let i=startOffset-1;i>=0;i--) cells.push({d:daysInPrevMonth-i, other:true, dateObj:new Date(y,m-1,daysInPrevMonth-i)});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, other:false, dateObj:new Date(y,m,d)});
  while(cells.length%7!==0) {
    const nd = cells.length - (startOffset+daysInMonth) + 1;
    cells.push({d:nd, other:true, dateObj:new Date(y,m+1,nd)});
  }

  const todayS = todayStr();

  let rows = '';
  for(let r=0;r<cells.length/7;r++){
    let row='<tr>';
    for(let c=0;c<7;c++){
      const cell = cells[r*7+c];
      const dateStr = fmtDate(cell.dateObj);
      const wd = WD[cell.dateObj.getDay()];
      const scheduled = cell.other? [] : state.employees.filter(e=>e.active && e.days.includes(wd));
      const logs = state.worklogs.filter(w=>w.date===dateStr);
      const loggedIds = new Set(logs.map(l=>l.employeeId));
      let tagsHtml = '';
      logs.slice(0,3).forEach(l=>{
        tagsHtml += `<span class="cal-tag"><span class="sq" style="background:${colorFor(l.employeeId||l.id)};"></span>${escapeHtml(l.name)}${l.isSub?'·대타':''}</span>`;
      });
      scheduled.filter(e=>!loggedIds.has(e.id)).slice(0, Math.max(0,3-logs.length)).forEach(e=>{
        tagsHtml += `<span class="cal-tag pend"><span class="sq"></span>${escapeHtml(e.name)}</span>`;
      });
      const totalCount = logs.length + scheduled.filter(e=>!loggedIds.has(e.id)).length;
      if(totalCount>3) tagsHtml += `<span class="cal-tag pend">+${totalCount-3}</span>`;
      row += `<td class="${cell.other?'otherm':''} ${dateStr===todayS?'today':''}" data-date="${dateStr}">
        <div class="dnum">${cell.d}</div>${tagsHtml}
      </td>`;
    }
    row+='</tr>';
    rows+=row;
  }

  main.innerHTML = `
    <div class="cal-head">
      <button id="prevM">‹</button>
      <span class="title">${y}년 ${m+1}월</span>
      <button id="nextM">›</button>
    </div>
    <table class="cal">
      <thead><tr>${WD.map(w=>`<th>${w}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="legend">
      <span><span class="sq hollow"></span>예정 · 미등록</span>
      <span><span class="sq solid"></span>근무 등록됨</span>
    </div>
    <button class="btn outline block" id="gotoToday" style="margin-top:16px;">오늘 출근부 작성</button>
  `;
  document.getElementById('fabWrap').innerHTML = '';
  document.getElementById('gotoToday').addEventListener('click', ()=>{
    const now = new Date();
    state.calYear = now.getFullYear();
    state.calMonth = now.getMonth();
    renderCalendar();
    openDayModal(todayStr());
  });
  document.getElementById('prevM').addEventListener('click', ()=>{
    state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;} renderCalendar();
  });
  document.getElementById('nextM').addEventListener('click', ()=>{
    state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;} renderCalendar();
  });
  main.querySelectorAll('td[data-date]').forEach(td=>{
    td.addEventListener('click', ()=>openDayModal(td.dataset.date));
  });
}

function openDayModal(dateStr){
  const dObj = new Date(dateStr+'T00:00:00');
  const wd = WD[dObj.getDay()];
  const scheduled = state.employees.filter(e=>e.active && e.days.includes(wd));
  const logs = state.worklogs.filter(w=>w.date===dateStr);
  const loggedIds = new Set(logs.map(l=>l.employeeId));
  const pending = scheduled.filter(e=>!loggedIds.has(e.id));

  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
  <div class="overlay" id="ovDay">
    <div class="modal modal-wrap">
      <button class="close-x" id="closeDay">✕</button>
      <h2>${dateStr} (${wd})</h2>

      ${pending.length? `<div class="section-title">예정된 근무 · 미등록</div>
        ${pending.map(e=>`
          <div class="sched-item">
            <div><b>${escapeHtml(e.name)}</b> · ${e.position} · ${e.slot}<div class="t">${e.startTime}~${e.endTime}</div></div>
            <button class="btn strong" data-confirm-emp="${e.id}">근무등록</button>
          </div>`).join('')}` : ''}

      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>등록된 근무</span>
        ${logs.length? `<span style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn strong" data-act="bulk-round" data-unit="60">1시간 단위 정리</button>
          <button class="btn strong" data-act="bulk-round" data-unit="10">10분 단위 정리</button>
          <button class="btn strong" data-act="bulk-slot">기준시간 정리</button>
        </span>` : ''}
      </div>
      <div id="logList">
        ${logs.length? logs.map(l=>`
          <div class="wl-item">
            <div class="info">
              <b>${escapeHtml(l.name)}</b>${l.isSub? `<span class="subtag">대타${l.subForName? ' · '+escapeHtml(l.subForName)+' 대신':''}</span>`:''}${!l.endTime? '<span class="subtag" style="color:var(--hall);">근무중</span>':''}
              <div class="sub">${l.startTime}~${l.endTime||'진행중'} ${l.endTime? '· '+fmtHours(calcHours(l.startTime,l.endTime))+' · 시급 '+won(l.wage) : ''}</div>
            </div>
            <div style="display:flex;gap:12px;">
              <button class="btn strong" data-edit-log="${l.id}">수정</button>
              <button class="btn danger" data-del-log="${l.id}">삭제</button>
            </div>
          </div>`).join('') : '<div class="empty" style="padding:20px 0;">등록된 근무가 없습니다.</div>'}
      </div>

      <button class="btn outline block" id="addAdhoc" style="margin-top:14px;">+ 근무 직접 추가 · 대타/추가인력</button>
    </div>
  </div>`;
  const ov = document.getElementById('ovDay');
  document.getElementById('closeDay').addEventListener('click', ()=>ov.remove());
  ov.addEventListener('click', ev=>{ if(ev.target===ov) ov.remove(); });

  ov.querySelectorAll('[data-act=bulk-round]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const unit = Number(b.dataset.unit);
      logs.forEach(l=>{
        l.startTime = floorTime(l.startTime, unit);
        if(l.endTime) l.endTime = floorTime(l.endTime, unit);
      });
      saveWorklogs();
      ov.remove();
      openDayModal(dateStr);
      showToast(unit===60? '1시간 단위로 정리했습니다' : '10분 단위로 정리했습니다');
    });
  });
  const bulkSlotBtn = ov.querySelector('[data-act=bulk-slot]');
  if(bulkSlotBtn){
    bulkSlotBtn.addEventListener('click', ()=>{
      let changed = 0;
      logs.forEach(l=>{
        const emp = state.employees.find(e=>e.id===l.employeeId);
        const st = emp ? SLOT_TIMES[emp.slot] : null;
        if(!st) return;
        l.startTime = st.start;
        if(l.endTime) l.endTime = st.end;
        changed++;
      });
      saveWorklogs();
      ov.remove();
      openDayModal(dateStr);
      showToast(changed>0? `기준시간으로 정리했습니다 (${changed}건)` : '기준시간을 적용할 근무가 없습니다');
    });
  }

  ov.querySelectorAll('[data-confirm-emp]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const emp = state.employees.find(x=>x.id===b.dataset.confirmEmp);
      ov.remove();
      openWorkForm({date:dateStr, employee:emp});
    });
  });
  ov.querySelectorAll('[data-edit-log]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const log = state.worklogs.find(x=>x.id===b.dataset.editLog);
      ov.remove();
      openWorkForm({date:dateStr, existingLog:log});
    });
  });
  ov.querySelectorAll('[data-del-log]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.dataset.confirming){
        state.worklogs = state.worklogs.filter(x=>x.id!==b.dataset.delLog);
        saveWorklogs();
        ov.remove();
        openDayModal(dateStr);
        showToast('삭제했습니다');
      } else {
        b.dataset.confirming = '1';
        b.textContent = '정말 삭제?';
      }
    });
  });
  document.getElementById('addAdhoc').addEventListener('click', ()=>{
    ov.remove();
    openWorkForm({date:dateStr});
  });
}

function openWorkForm({date, employee, existingLog}){
  const activeEmps = state.employees.filter(e=>e.active);
  const isEdit = !!existingLog;
  const preset = existingLog ? {
    empId: existingLog.employeeId,
    name: existingLog.name,
    start: existingLog.startTime,
    end: existingLog.endTime,
    wage: existingLog.wage,
    isSub: existingLog.isSub,
    subForName: existingLog.subForName||'',
    note: existingLog.note||'',
    manual: !state.employees.find(e=>e.id===existingLog.employeeId)
  } : employee ? {
    empId: employee.id, name: employee.name, start: employee.startTime, end: employee.endTime,
    wage: employee.wage, isSub:false, subForName:'', note:'', manual:false
  } : {
    empId:'', name:'', start:'09:00', end:'14:00', wage:11000, isSub:false, subForName:'', note:'', manual:false
  };

  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
  <div class="overlay" id="ovWork">
    <div class="modal modal-wrap">
      <button class="close-x" id="closeWork">✕</button>
      <h2>${isEdit? '근무 수정':'근무 등록'} · ${date}</h2>

      <div class="field">
        <label>근무자</label>
        <select id="w-emp">
          <option value="">직접입력 · 대타/외부인력</option>
          ${activeEmps.map(e=>`<option value="${e.id}" ${preset.empId===e.id?'selected':''}>${escapeHtml(e.name)} (${e.position}·${e.slot})</option>`).join('')}
        </select>
      </div>
      <div class="field" id="manualNameWrap" style="display:${preset.manual?'block':'none'};">
        <label>이름 직접 입력</label>
        <input type="text" id="w-manualname" value="${escapeHtml(preset.manual? preset.name:'')}" placeholder="이름 입력">
      </div>

      <div class="field">
        <label class="checkline"><input type="checkbox" id="w-issub" ${preset.isSub?'checked':''}> 대타 근무입니다</label>
      </div>
      <div class="field" id="subForWrap" style="display:${preset.isSub?'block':'none'};">
        <label>원래 근무자 (선택)</label>
        <select id="w-subfor">
          <option value="">선택 안 함</option>
          ${state.employees.map(e=>`<option value="${escapeHtml(e.name)}" ${preset.subForName===e.name?'selected':''}>${escapeHtml(e.name)}${e.active?'':' (퇴사)'}</option>`).join('')}
        </select>
      </div>

      <div class="row2">
        <div class="field"><label>출근시간</label><input type="time" id="w-start" value="${preset.start}"></div>
        <div class="field"><label>퇴근시간</label><input type="time" id="w-end" value="${preset.end}"></div>
      </div>
      <div class="field"><label>시급 (원)</label><input type="number" id="w-wage" value="${preset.wage}" step="100"></div>
      <div class="field"><label>메모 (선택)</label><input type="text" id="w-note" value="${escapeHtml(preset.note)}" placeholder="예: 30분 조퇴"></div>

      <button class="btn primary block" id="saveWork">${isEdit? '수정 완료':'등록하기'}</button>
    </div>
  </div>`;
  const ov = document.getElementById('ovWork');
  document.getElementById('closeWork').addEventListener('click', ()=>{ ov.remove(); });
  ov.addEventListener('click', ev=>{ if(ev.target===ov) ov.remove(); });

  const empSel = document.getElementById('w-emp');
  empSel.addEventListener('change', ()=>{
    const wrap = document.getElementById('manualNameWrap');
    if(empSel.value===''){ wrap.style.display='block'; }
    else{
      wrap.style.display='none';
      const emp = state.employees.find(e=>e.id===empSel.value);
      if(emp){
        document.getElementById('w-start').value = emp.startTime;
        document.getElementById('w-end').value = emp.endTime;
        document.getElementById('w-wage').value = emp.wage;
      }
    }
  });
  document.getElementById('w-issub').addEventListener('change', (e)=>{
    document.getElementById('subForWrap').style.display = e.target.checked? 'block':'none';
  });

  document.getElementById('saveWork').addEventListener('click', ()=>{
    const empId = empSel.value;
    let name, finalEmpId;
    if(empId){
      const emp = state.employees.find(e=>e.id===empId);
      name = emp.name; finalEmpId = emp.id;
    } else {
      const manualName = document.getElementById('w-manualname').value.trim();
      if(!manualName){ showToast('이름을 입력해주세요'); return; }
      name = manualName; finalEmpId = 'manual_'+manualName;
    }
    const start = document.getElementById('w-start').value;
    const end = document.getElementById('w-end').value;
    if(!start || !end){ showToast('근무 시간을 입력해주세요'); return; }
    const wage = Number(document.getElementById('w-wage').value)||0;
    const isSub = document.getElementById('w-issub').checked;
    const subForName = document.getElementById('w-subfor').value.trim();
    const note = document.getElementById('w-note').value.trim();

    const logObj = {
      id: isEdit? existingLog.id : uid(),
      date, employeeId: finalEmpId, name, startTime:start, endTime:end, wage,
      isSub, subForName: isSub? subForName : '', note
    };
    if(isEdit){
      const idx = state.worklogs.findIndex(x=>x.id===existingLog.id);
      state.worklogs[idx] = logObj;
    } else {
      state.worklogs.push(logObj);
    }
    saveWorklogs();
    ov.remove();
    renderCalendar();
    showToast(isEdit? '수정했습니다':'등록했습니다');
  });
}

/* ============ PAYROLL TAB ============ */
function renderPayroll(){
  const main = document.getElementById('main');
  document.getElementById('fabWrap').innerHTML = '';
  const opts = state.employees.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}${e.active?'':' (퇴사)'}</option>`).join('');

  const now = new Date();
  const firstOfMonth = fmtDate(new Date(now.getFullYear(), now.getMonth(), 1));
  const today = fmtDate(now);

  main.innerHTML = `
    <div class="section-title">급여 계산</div>
    ${state.employees.length===0? '<div class="empty">먼저 알바를 등록해주세요.</div>' : `
    <div class="field" style="margin-top:12px;">
      <label>알바 선택</label>
      <select id="p-emp"><option value="">선택하세요</option>${opts}</select>
    </div>
    <div class="row2">
      <div class="field"><label>시작일</label><input type="date" id="p-start" value="${firstOfMonth}"></div>
      <div class="field"><label>종료일 · 급여일</label><input type="date" id="p-end" value="${today}"></div>
    </div>
    <div class="quickrange">
      <button class="btn" id="qThis">이번달</button>
      <button class="btn" id="qLast">지난달</button>
    </div>
    <div class="field">
      <label class="checkline"><input type="checkbox" id="p-tax"> 3.3% 세금 공제 (원천징수)</label>
    </div>
    <button class="btn primary block" id="calcBtn">계산하기</button>
    <div id="payResult"></div>
    `}
  `;
  if(state.employees.length===0) return;

  document.getElementById('qThis').addEventListener('click', ()=>{
    document.getElementById('p-start').value = fmtDate(new Date(now.getFullYear(), now.getMonth(), 1));
    document.getElementById('p-end').value = today;
  });
  document.getElementById('qLast').addEventListener('click', ()=>{
    const ls = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const le = new Date(now.getFullYear(), now.getMonth(), 0);
    document.getElementById('p-start').value = fmtDate(ls);
    document.getElementById('p-end').value = fmtDate(le);
  });
  document.getElementById('calcBtn').addEventListener('click', ()=>{
    const empId = document.getElementById('p-emp').value;
    if(!empId){ showToast('알바를 선택해주세요'); return; }
    const start = document.getElementById('p-start').value;
    const end = document.getElementById('p-end').value;
    if(!start || !end){ showToast('기간을 선택해주세요'); return; }
    const entries = state.worklogs.filter(w=>w.employeeId===empId && w.date>=start && w.date<=end)
      .sort((a,b)=> a.date<b.date? -1:1);
    let totalHours = 0, totalPay = 0;
    const lines = entries.map(l=>{
      if(!l.endTime){
        return `<div class="payline">
          <span class="d1">${l.date} ${l.startTime}~ (진행중)${l.isSub?' · 대타':''}</span>
          <span style="color:var(--sub);">미완료</span>
        </div>`;
      }
      const h = calcHours(l.startTime,l.endTime);
      const pay = h*l.wage;
      totalHours += h; totalPay += pay;
      return `<div class="payline">
        <span class="d1">${l.date} ${l.startTime}~${l.endTime}${l.isSub?' · 대타':''}</span>
        <span>${fmtHours(h)} · ${won(pay)}</span>
      </div>`;
    }).join('');
    const emp = state.employees.find(e=>e.id===empId);
    const taxOn = document.getElementById('p-tax').checked;
    const taxAmount = taxOn ? Math.round(totalPay*0.033) : 0;
    const netPay = totalPay - taxAmount;
    document.getElementById('payResult').innerHTML = `
      <div class="result-box">
        <div class="result-total">
          <div><div class="lbl">${escapeHtml(emp? emp.name : '')} · ${start} ~ ${end}</div></div>
          <div class="val">${won(netPay)}</div>
        </div>
        ${taxOn? `
        <div class="payline"><span class="d1">세전 금액</span><span>${won(totalPay)}</span></div>
        <div class="payline"><span class="d1">3.3% 원천징수</span><span>-${won(taxAmount)}</span></div>
        ` : ''}
        <div style="font-size:11px;color:var(--sub);margin:8px 0;">총 근무시간 ${fmtHours(totalHours)} · 근무일수 ${entries.length}일</div>
        ${lines || '<div class="empty" style="padding:16px 0;">해당 기간 근무 기록이 없습니다.</div>'}
      </div>
      <button class="btn outline block" id="csvBtn" style="margin-top:14px;">CSV 다운로드</button>
    `;
    document.getElementById('csvBtn').addEventListener('click', ()=>{
      const rows = [['날짜','요일','출근','퇴근','근무시간(시간)','시급','금액','비고']];
      entries.forEach(l=>{
        const wd = WD[new Date(l.date+'T00:00:00').getDay()];
        if(!l.endTime){
          rows.push([l.date, wd, l.startTime, '', '', l.wage, '', '진행중'+(l.isSub?' · 대타':'')]);
        } else {
          const h = calcHours(l.startTime,l.endTime);
          rows.push([l.date, wd, l.startTime, l.endTime, h.toFixed(2), l.wage, Math.round(h*l.wage), l.isSub? '대타':'']);
        }
      });
      rows.push([]);
      rows.push(['총 근무시간(시간)', totalHours.toFixed(2)]);
      rows.push(['세전 합계', totalPay]);
      if(taxOn){
        rows.push(['3.3% 원천징수', -taxAmount]);
        rows.push(['실지급액', netPay]);
      }
      const csv = rows.map(r=>r.map(v=>{
        const s = String(v===undefined? '' : v);
        return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
      }).join(',')).join('\n');
      const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const empName = emp? emp.name : 'employee';
      a.href = url;
      a.download = `${empName}_${start}_${end}_급여.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    });
  });
}

/* ============ LOCK SCREEN ============ */
const PIN_CODE = '2478';
let pinBuffer = '';
let pinTargetTab = null;

function openPinModal(targetTab){
  pinTargetTab = targetTab;
  pinBuffer = '';
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
  <div class="overlay" id="ovPin">
    <div class="modal modal-wrap">
      <button class="close-x" id="closePin">✕</button>
      <div class="lock-logo" style="margin-bottom:24px;">
        <div class="brand" style="font-size:18px;">맘스터치</div>
        <div class="bar"></div>
        <div class="store">관리자 모드 · 비밀번호 입력</div>
      </div>
      <div class="pin-dots" id="pinDots" style="justify-content:center;margin-bottom:24px;">
        ${[0,1,2,3].map(()=>'<span class="pin-dot"></span>').join('')}
      </div>
      <div class="keypad" id="keypad" style="margin:0 auto;">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-n="${n}">${n}</button>`).join('')}
        <button type="button" class="empty" tabindex="-1"></button>
        <button type="button" data-n="0">0</button>
        <button type="button" class="back" data-n="back">⌫</button>
      </div>
      <div class="lock-error" id="lockError" style="text-align:center;"></div>
    </div>
  </div>`;
  const ov = document.getElementById('ovPin');

  function pressDigit(d){
    if(pinBuffer.length>=4) return;
    pinBuffer += d;
    updateDots();
    if(pinBuffer.length===4) setTimeout(checkPin, 120);
  }
  function pressBack(){
    pinBuffer = pinBuffer.slice(0,-1);
    updateDots();
  }
  function keyHandler(ev){
    if(ev.key>='0' && ev.key<='9'){ pressDigit(ev.key); ev.preventDefault(); }
    else if(ev.key==='Backspace'){ pressBack(); ev.preventDefault(); }
  }
  function closeModal(){
    document.removeEventListener('keydown', keyHandler);
    ov.remove();
  }
  window._closePinModal = closeModal;
  document.addEventListener('keydown', keyHandler);

  document.getElementById('closePin').addEventListener('click', closeModal);
  ov.addEventListener('click', ev=>{ if(ev.target===ov) closeModal(); });
  document.getElementById('keypad').addEventListener('click', ev=>{
    const b = ev.target.closest('button[data-n]');
    if(!b) return;
    if(b.dataset.n==='back'){ pressBack(); return; }
    pressDigit(b.dataset.n);
  });
}
function updateDots(){
  document.querySelectorAll('#pinDots .pin-dot').forEach((d,i)=>{
    d.classList.toggle('filled', i<pinBuffer.length);
    d.classList.remove('error');
  });
  const le = document.getElementById('lockError');
  if(le) le.textContent = '';
}
function checkPin(){
  if(pinBuffer === PIN_CODE){
    state.unlocked = true;
    state.tab = pinTargetTab;
    if(window._closePinModal) window._closePinModal();
    render();
  } else {
    document.querySelectorAll('#pinDots .pin-dot').forEach(d=>d.classList.add('error'));
    const le = document.getElementById('lockError');
    if(le) le.textContent = '비밀번호가 틀렸습니다';
    const md = document.querySelector('#ovPin .modal');
    if(md){ md.style.animation='shake .3s'; }
    setTimeout(()=>{
      pinBuffer = '';
      updateDots();
      if(md) md.style.animation='';
    }, 350);
  }
}
